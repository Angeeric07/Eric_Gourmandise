<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro & Gourmandise - Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Hero Section -->
    <header class="hero">
        <div class="overlay">
            <h1>Eric Gourmandise</h1>
            <p>Cuisine fraîche & fait maison</p>
            <div class="hero-buttons">
                <a href="#menu" class="btn btn-primary">Voir la Carte</a>
                <a href="#reservation" class="btn btn-secondary">Réserver une table</a>
            </div>
        </div>
    </header>

    <!-- Section Menu -->
    <section id="menu" class="section">
        <h2>Notre Carte</h2>
        
        <!-- Filtres par catégorie -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-category="tous">Tous</button>
            <button class="filter-btn" data-category="entrees">Entrées</button>
            <button class="filter-btn" data-category="plats">Plats</button>
            <button class="filter-btn" data-category="desserts">Desserts</button>
            <button class="filter-btn" data-category="boissons">Boissons</button>
        </div>

        <!-- Grille des plats (Générée dynamiquement en JS) -->
        <div class="menu-grid" id="menu-container">
            <!-- Les cartes de plats s'afficheront ici -->
        </div>
    </section>

    <!-- Section Réservation WhatsApp -->
    <section id="reservation" class="section bg-light">
        <h2>Réserver une Table</h2>
        <form id="reservation-form" class="form">
            <div class="form-group">
                <label for="nom">Nom complet</label>
                <input type="text" id="nom" required placeholder="Ex: Jean Dupont">
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="heure">Heure</label>
                <input type="time" id="heure" required>
            </div>
            <div class="form-group">
                <label for="personnes">Nombre de personnes</label>
                <input type="number" id="personnes" min="1" max="20" value="2" required>
            </div>
            <button type="submit" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i> Envoyer via WhatsApp
            </button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
